[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memento-analytics-demo"
version = "0.1.0"
description = "Local manifest-driven retail ingestion MVP"
requires-python = ">=3.11"
dependencies = [
  "duckdb==1.5.6",
  "mcp==2.3.0",
  "jsonschema>=4.26,<5",
  "fastapi>=0.116,<1",
  "pyarrow>=21,<24",
  "pydantic>=2.11,<3",
  "uvicorn>=0.35,<1",
  "PyJWT[crypto]==2.15.1",
]

[project.optional-dependencies]
dev = ["httpx2>=2,<3", "pyright>=1.1,<2", "pytest>=9.0.3,<10"]

[project.scripts]
memento-ingest = "memento.cli:main"
memento-serve = "memento.api_cli:main"
memento-mcp = "memento.mcp_cli:main"
memento-signal = "memento.signal_cli:main"
memento-metrics = "memento.metric_cli:main"
memento-metric-replay = "memento.metric_replay:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
  "e2e: exercises the synthetic pipeline across real runtime boundaries",
]

[tool.pyright]
include = [
  "src/memento",
  "tools",
]
exclude = ["**/__pycache__"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
reportMissingTypeStubs = false
